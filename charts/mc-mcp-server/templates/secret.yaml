{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) (or .Values.auth.token .Values.auth.generate) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mc-mcp-server.authSecretName" . }}
  labels:
    {{- include "mc-mcp-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.secretKey }}: {{ include "mc-mcp-server.authToken" . | quote }}
{{- end }}
